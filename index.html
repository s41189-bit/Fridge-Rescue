<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fridge Rescue 智慧冰箱剩食推薦與保鮮管家">

    <title>Fridge Rescue｜智慧冰箱剩食推薦與保鮮管家</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 自訂 CSS -->
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>

    <!-- 頂端導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand" href="#">Fridge Rescue</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#fridgeSection">我的冰箱</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#shoppingSection">採買清單</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#recipeSection">食譜推薦</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#restockSection">智慧補貨</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

   <!-- 左上角只留三個統計標籤 -->
    <header class="compact-header py-2 border-bottom">
        <div class="container">
            <div class="d-flex flex-wrap gap-2">
                <span class="badge bg-success px-2 py-1">
                    庫存食材：<span id="inventoryCount">0</span>
                </span>

                <span class="badge bg-warning text-dark px-2 py-1">
                    即期食材：<span id="expiringCount">0</span>
                </span>

                <span class="badge bg-primary px-2 py-1">
                    零採買料理：<span id="availableRecipeCount">0</span>
                </span>
            </div>
        </div>
    </header>

    <!-- 網站主要內容 -->
    <main class="container py-3">

        <div id="appMessage" role="status" aria-live="polite"></div>

        <div class="row g-3">

            <!-- 左欄（佔 4 等份）：我的冰箱 ＋ 智慧補貨 -->
            <aside class="col-lg-4" id="fridgeSection">

                <!-- 1. 我的冰箱卡片 -->
                <div class="card mb-3">
                    <div class="card-body">

                        <h2 class="h5 mb-3">🧊 我的冰箱</h2>

                        <div id="mockFridgePanel">

                            <form id="mockFridgeForm">

                                <div class="mb-2">
                                    <label for="ingredientSelect" class="form-label small fw-bold mb-1">
                                        選擇食材
                                    </label>

                                    <select id="ingredientSelect"
                                        class="form-select form-select-sm" required>
                                        <option value="">請選擇食材</option>
                                    </select>
                                </div>

                                <div class="mb-2">
                                    <label for="expiryDate" class="form-label small fw-bold mb-1">
                                        到期日期
                                    </label>

                                    <input type="date" id="expiryDate"
                                        class="form-control form-control-sm">

                                    <small class="text-muted" style="font-size: 12px;">
                                        未設定日期也可以參與配對。
                                    </small>
                                </div>

                                <button type="submit"
                                    class="btn btn-success btn-sm w-100 mt-1">
                                    ＋ 新增食材
                                </button>

                            </form>

                            <hr class="my-3">

                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h3 class="h6 mb-0 fw-bold">目前庫存</h3>
                                <div class="d-flex gap-1">
                                    <button type="button" id="loadDemoBtn"
                                        class="btn btn-outline-success btn-sm py-0 px-2" style="font-size: 12px;">
                                        載入示範
                                    </button>
                                    <button type="button" id="clearFridgeBtn"
                                        class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size: 12px;">
                                        清空
                                    </button>
                                </div>
                            </div>

                            <div id="mockFridgeList" class="fridge-scroll-area">
                                <p class="text-muted small mb-0">目前沒有食材。</p>
                            </div>

                        </div>

                        <small class="text-muted d-block mt-2" style="font-size: 12px;">
                            ＊保存期限燈號僅反映輸入日期，不代表食品安全鑑定。
                        </small>

                    </div>
                </div>

                <!-- 2. 智慧補貨推薦（移至左欄下方，方便對照） -->
                <div class="card" id="restockSection">
                    <div class="card-body">
                        <h2 class="h5 mb-1">💡 智慧補貨推薦</h2>
                        <p class="text-muted small mb-2">
                            只多買一樣食材，就能解鎖更多料理。
                        </p>
                        <div id="restockList"></div>
                    </div>
                </div>

            </aside>

            <!-- 右欄（佔 8 等份）：最上方直接放「採買清單」與「篩選/抽籤」，接著顯示「食譜推薦」 -->
            <section class="col-lg-8" id="recipeSection">

                <!-- ★ 移到最上方：我的採買清單（選完食譜不用往下滑，直接在上方看到！） -->
                <div class="card mb-3 border-success" id="shoppingSection">
                    <div class="card-body py-3">

                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                            <div class="d-flex align-items-center gap-2">
                                <h2 class="h5 mb-0 text-success">🛒 我的採買清單</h2>
                                <span class="badge bg-secondary">
                                    已購買 <span id="purchasedCount">0</span> / <span id="shoppingCount">0</span> 項
                                </span>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="button" id="copyShoppingBtn"
                                    class="btn btn-success btn-sm">
                                    複製採買清單
                                </button>
                                <button type="button" id="clearShoppingBtn"
                                    class="btn btn-outline-danger btn-sm">
                                    清空清單
                                </button>
                            </div>
                        </div>

                        <!-- JavaScript 動態產生採買清單（改為橫向緊湊排列） -->
                        <div id="shoppingList" class="shopping-grid"></div>

                        <!-- 複製功能的備援文字區 -->
                        <div id="copyFallback" class="mt-2" hidden>
                            <label for="shoppingCopyText" class="form-label small">
                                請手動複製以下文字：
                            </label>
                            <textarea id="shoppingCopyText"
                                class="form-control form-control-sm"
                                rows="3" readonly></textarea>
                        </div>

                    </div>
                </div>

                <!-- 篩選條件 ＋ 今天吃什麼抽籤機（合併成緊湊工具列） -->
                <div class="card mb-3">
                    <div class="card-body py-3">

                        <div class="row g-2 align-items-end">

                            <div class="col-sm-4">
                                <label for="timeFilter" class="form-label small fw-bold mb-1">
                                    料理時間
                                </label>
                                <select id="timeFilter" class="form-select form-select-sm">
                                    <option value="all">不限時間</option>
                                    <option value="10">10 分鐘以內</option>
                                    <option value="20">20 分鐘以內</option>
                                    <option value="30">30 分鐘以內</option>
                                </select>
                            </div>

                            <div class="col-sm-4">
                                <label for="difficultyFilter" class="form-label small fw-bold mb-1">
                                    料理難度
                                </label>
                                <select id="difficultyFilter" class="form-select form-select-sm">
                                    <option value="all">不限難度</option>
                                    <option value="簡單">簡單</option>
                                    <option value="中等">中等</option>
                                    <option value="困難">困難</option>
                                </select>
                            </div>

                            <div class="col-sm-4">
                                <label for="dietFilter" class="form-label small fw-bold mb-1">
                                    飲食偏好
                                </label>
                                <select id="dietFilter" class="form-select form-select-sm">
                                    <option value="all">不限偏好</option>
                                    <option value="蛋奶素">蛋奶素</option>
                                    <option value="無肉">無肉</option>
                                    <option value="無乳製品">無乳製品</option>
                                </select>
                            </div>

                        </div>

                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3 pt-2 border-top">
                            <!-- 零採買模式 -->
                            <div class="form-check form-switch mb-0">
                                <input type="checkbox"
                                    class="form-check-input"
                                    id="zeroShopping">
                                <label class="form-check-label small"
                                    for="zeroShopping">
                                    零採買模式（只顯示食材全齊）
                                </label>
                            </div>

                            <!-- 料理抽籤機按鈕與重設篩選並排 -->
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <button type="button" id="randomRecipeBtn"
                                    class="btn btn-warning btn-sm fw-bold">
                                    🎲 今天吃什麼？（抽一道料理）
                                </button>

                                <button type="button" id="resetFiltersBtn"
                                    class="btn btn-outline-secondary btn-sm">
                                    重設篩選
                                </button>
                            </div>
                        </div>

                        <div id="randomRecipeMessage" class="small text-danger mt-1"
                            role="status" aria-live="polite"></div>

                    </div>
                </div>

                <!-- 食譜列表標題列 -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="h5 mb-0">🍳 智慧食譜推薦</h2>
                    <span class="text-muted small">
                        符合條件的料理：<strong><span id="recipeCount">0</span></strong> 道
                    </span>
                </div>

                <!-- JavaScript 動態產生食譜卡片 -->
                <div id="recipeList" class="row g-3"></div>

            </section>

        </div>

    </main>

    <!-- Bootstrap Modal：食譜詳情 -->
    <div class="modal fade" id="recipeModal" tabindex="-1"
        aria-labelledby="recipeModalTitle" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-scrollable">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title h5" id="recipeModalTitle">
                        食譜詳情
                    </h2>

                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="關閉"></button>

                </div>

                <div class="modal-body" id="recipeModalBody"></div>

                <div class="modal-footer">

                    <button type="button" id="modalAddShoppingBtn"
                        class="btn btn-success">
                        加入採買清單
                    </button>

                    <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        關閉
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- 網站頁尾 -->
    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-1 small">Fridge Rescue｜網站企劃課程專案</p>
        <small class="text-white-50" style="font-size: 12px;">
            庫存與採買清單保存在目前瀏覽器 (localStorage)
        </small>
    </footer>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 食材主檔 -->
    <script src="ingredients.js"></script>

    <!-- 測試食譜 -->
    <script src="recipes.js"></script>

    <!-- 主要功能程式 -->
    <script src="myScript.js"></script>

</body>

</html>
